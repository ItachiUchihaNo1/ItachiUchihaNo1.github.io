name: Inspect Naamiraa payment configuration flags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naamiraa-bale-flags.yml']
permissions:
  contents: read
concurrency:
  group: naamiraa-production-domains
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USER: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: 89fd584b561a3caf03e91c1d351aa497ec673244
          path: namira-source
          persist-credentials: false
      - name: Read only known configuration presence flags
        run: |
          python3 -u - <<'PY'
          import os,sys,ssl,secrets,hashlib,json
          from urllib.request import Request,urlopen
          sys.path.insert(0,'namira-source/namira/deploy')
          import domains as d
          f=d.FTP_TLS(context=ssl.create_default_context(),timeout=60);f.connect(os.environ['DEPLOY_FTPS_HOST'],21);f.login(os.environ['DEPLOY_FTPS_USER'],os.environ['DEPLOY_FTPS_PASSWORD']);f.prot_p();r=d.Remote(f);key=secrets.token_hex(32);name='_namira-bale-flags-'+secrets.token_hex(16)+'.php';target='admin.naamiraa.ir/'+name
          php="""<?php
          declare(strict_types=1);ini_set('display_errors','0');set_time_limit(100);
          if(!hash_equals('__HASH__',hash('sha256',$_SERVER['HTTP_X_NAMIRA_FLAGS']??''))){http_response_code(404);exit;}
          define('NAMIRA_SURFACE','admin');define('NAMIRA_SHARED_PATH',dirname(__DIR__).'/_namira_live');require NAMIRA_SHARED_PATH.'/current.php';header('Content-Type: application/json');header('Cache-Control: no-store');
          $file=Namira\\Env::privateRoot().'/config.local.json';$raw=file_get_contents($file);$c=json_decode($raw,true,24,JSON_THROW_ON_ERROR);
          $filled=static fn($a,$k)=>is_array($a)&&is_string($a[$k]??null)&&trim($a[$k])!=='';
          $candidates=[];$scan=function($node,$where='root',$depth=0)use(&$scan,&$candidates,$filled){if(!is_array($node)||$depth>6)return;if($filled($node,'bot_token')&&$filled($node,'provider_token'))$candidates[]=[$where,$node['bot_token'],$node['provider_token']];foreach($node as $k=>$v)if(is_array($v))$scan($v,$where.'.'.(in_array($k,['payment','payments','sms','bale','config','settings'],true)?$k:'<nested>'),$depth+1);};$scan($c);
          if($filled($c,'BALE_BOT_TOKEN')&&$filled($c,'BALE_PROVIDER_TOKEN'))$candidates[]=['root.flat',$c['BALE_BOT_TOKEN'],$c['BALE_PROVIDER_TOKEN']];
          $unique=[];foreach($candidates as $candidate)$unique[hash('sha256',$candidate[1].'|'.$candidate[2])]=$candidate;
          $p=is_array($c['payment']??null)?$c['payment']:[];$repair='none';
          if($filled($p,'bot_token')&&$filled($p,'provider_token'))$chosen=['root.payment',$p['bot_token'],$p['provider_token']];
          elseif(count($unique)===1)$chosen=array_values($unique)[0];else $chosen=null;
          if($chosen&&preg_match('/^[0-9]+:[A-Za-z0-9_-]+$/D',trim($chosen[1]))){
           $next=['enabled'=>true,'driver'=>'bale','bot_token'=>trim($chosen[1]),'provider_token'=>trim($chosen[2])];
           if(($c['payment']??null)!==$next){$backup=Namira\\Env::privateRoot().'/config.local.before-bale-'.bin2hex(random_bytes(8)).'.json';file_put_contents($backup,$raw,LOCK_EX);chmod($backup,0600);$c['payment']=$next;$temp=$file.'.'.bin2hex(random_bytes(8));file_put_contents($temp,json_encode($c,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR),LOCK_EX);chmod($temp,0600);rename($temp,$file);$repair=$chosen[0]==='root.payment'?'enabled_existing_section':'mapped_existing_tokens';}
           Namira\\Env::loadJson($file);
          }
          $db=Namira\\Db::connect();$settings=Namira\\StoreSettings::get($db);$connection='not_configured';$error='';
          if(Namira\\BaleClient::configured()){try{$actor=Namira\\Db::query($db,"SELECT id,role,email FROM users WHERE role='superadmin' AND active=1 ORDER BY id LIMIT 1")->fetch();$_SESSION=['user_id'=>$actor['id']];Namira\\BalePayments::setup($db,$actor,false);$connection='connected';}catch(Namira\\HttpError $e){$connection='needs_attention';$error=$e->getMessage();}catch(Throwable $e){$connection='needs_attention';$error='بررسی اتصال کامل نشد.';}}
          echo json_encode(['config_file'=>realpath($file),'modified_utc'=>gmdate('Y-m-d H:i:s',filemtime($file)),'candidate_locations'=>array_column($candidates,0),'distinct_candidate_count'=>count($unique),'repair'=>$repair,'root_payment_present'=>is_array($c['payment']??null),'bot_key_occurrences'=>preg_match_all('/"bot_token"\\s*:/',$raw),'provider_key_occurrences'=>preg_match_all('/"provider_token"\\s*:/',$raw),'bale_configured'=>Namira\\BaleClient::configured(),'bale_activated'=>Namira\\BalePayments::available(),'connection'=>$connection,'connection_error'=>$error,'sales_enabled'=>(bool)$settings['enable_sales'],'sales_terms_present'=>trim($settings['sales_terms'])!=='','real_payments'=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          
          """
          try:
              r.put(target,php.replace('__HASH__',hashlib.sha256(key.encode()).hexdigest()).encode(),False)
              with urlopen(Request('https://admin.naamiraa.ir/'+name,headers={'X-Namira-Flags':key}),context=ssl.create_default_context(),timeout=60) as response:proof=json.loads(response.read())
              print('BALE_CONFIG_FLAGS '+json.dumps(proof),flush=True)
          finally:
              r.remove_created(target);f.quit()
          
          PY
