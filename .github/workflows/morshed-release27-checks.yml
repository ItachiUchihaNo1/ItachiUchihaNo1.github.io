name: Morshed release27 isolated checks
on:
  push:
    branches: [codex/morshed-release27-checks]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: PHP extensions
        run: sudo apt-get update -qq && sudo apt-get install -y php-mysql php-gd php-curl php-mbstring
      - name: Lint and isolated database tests
        run: |
          find morshed-core -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m unittest discover -s tests -p test_deploy_cpanel.py -v
          python3 tests/ci27.py

