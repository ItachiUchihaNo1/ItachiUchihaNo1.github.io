name: Diagnose Naamiraa SMS without sending
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naamiraa-sms-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: naamiraa-production-domains
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOME_SOURCE: '8ac2c2490cd418e982cd54aa0272b6200230927d'
      HOME_PLAN: '[{"path":"app/Env.php","oldHash":"1c4e6b9e789b54a19d7365cd3d4560008126e5c2d8c77b40dafaa5af6ec814ae","newHash":"e51d3a92b16f9c0055333be491b9a62aadfb267253e25cd266fdbddf0700e0de"},{"path":"app/TsmsClient.php","oldHash":"a7c0c1110ccd5ed0c1b24d22234ca973ad6c2a4eaeca1d117f4e0bb563ff67e7","newHash":"f412f2f7b31006bdde52165d8d9b9634005fdfd9853e866f0907a52ac1401a7b"},{"path":"app/SmsService.php","oldHash":"87cbab4013f5208ffebe7f4c1691d159e02c4bcda3b8cb5c4bcb2c662ad3b43f","newHash":"f7c67fb7791df2fd9f845cc11e3334f2c17d02d75471c449d0cb179a2610fdf3"},{"path":"app/MobileAuth.php","oldHash":"9cf788c79da28cc9290a36f9fbf1e4351210228380a71a0f3a50542a3987dd42","newHash":"11a9f2d7462da86a48d4baafbc0db0af7bda415b8805d83832a7382769460cef"}]'
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USER: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: 8ac2c2490cd418e982cd54aa0272b6200230927d
          path: namira-source
          persist-credentials: false
      - name: Read sanitized configuration and recent SMS error types - no send
        run: |
          python3 - <<'PY'
          PHP_SOURCE="<?php\ndeclare(strict_types=1);\nini_set('display_errors','0');\nheader('Content-Type: application/json; charset=utf-8');header('Cache-Control: no-store');\nif(!hash_equals('__HASH__',hash('sha256',$_SERVER['HTTP_X_NAMIRA_DIAGNOSTIC']??''))){http_response_code(404);exit;}\ntry{\n define('NAMIRA_SURFACE','public');define('NAMIRA_SHARED_PATH',dirname(__DIR__).'/_namira_live');require NAMIRA_SHARED_PATH.'/current.php';\n $db=Namira\\Db::connect();$out=['ready'=>Namira\\MobileAuth::available(),'sender_looks_like_mobile'=>preg_match('/^09[0-9]{9}$/D',Namira\\Env::get('TSMS_SENDER'))===1,'curl_present'=>function_exists('curl_init')];\n $rows=Namira\\Db::query($db,'SELECT delivered,consumed_at,expires_at,created_at FROM otp_challenges ORDER BY created_at DESC LIMIT 5')->fetchAll();$out['recent_challenges']=array_map(fn($r)=>['age_seconds'=>time()-(int)$r['created_at'],'provider_accepted'=>(bool)$r['delivered'],'consumed'=>$r['consumed_at']!==null,'expired'=>(int)$r['expires_at']<time()],$rows);\n $out['send_attempt_states']=Namira\\Db::query($db,\"SELECT hits,COUNT(*) AS total FROM rate_limits WHERE bucket LIKE 'sms-once-%' AND expires>? GROUP BY hits\",[time()])->fetchAll();\n $out['transport']=[];\n foreach(['https://tsms.ir/url/tsmshttp.php','https://www.tsms.ir/url/tsmshttp.php','http://tsms.ir/url/tsmshttp.php'] as $url){\n  $ch=curl_init($url);curl_setopt_array($ch,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>false,CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>10,CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_USERAGENT=>'Namira-TSMS-Diagnostics/1.0']);$body=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);$errno=curl_errno($ch);curl_close($ch);$body=is_string($body)?trim($body):'';\n  $out['transport'][]=['scheme'=>parse_url($url,PHP_URL_SCHEME),'host'=>parse_url($url,PHP_URL_HOST),'http'=>$status,'curl_errno'=>$errno,'bytes'=>strlen($body),'public_no_credentials_numeric_reply'=>preg_match('/^-?[0-9]{1,20}$/D',$body)?$body:null,'html'=>str_contains(strtolower($body),'<html')];\n }\n echo json_encode($out,JSON_UNESCAPED_UNICODE);\n}catch(Throwable $e){http_response_code(503);echo json_encode(['error_class'=>get_class($e)]);}\n"
          import os,sys,json,ssl,secrets,hashlib
          from urllib.request import Request,urlopen
          sys.path.insert(0,'namira-source/namira/deploy')
          import domains as d
          f=d.FTP_TLS(context=ssl.create_default_context(),timeout=45);f.connect(os.environ['DEPLOY_FTPS_HOST'],21);f.login(os.environ['DEPLOY_FTPS_USER'],os.environ['DEPLOY_FTPS_PASSWORD']);f.prot_p();r=d.Remote(f)
          key=secrets.token_hex(32);name='namira-sms-diagnostic-'+secrets.token_hex(16)+'.php';target='public_html/'+name
          try:
              php=PHP_SOURCE.replace('__HASH__',hashlib.sha256(key.encode()).hexdigest()).encode()
              r.put(target,php)
              req=Request('https://naamiraa.ir/'+name,headers={'X-Namira-Diagnostic':key,'Cache-Control':'no-cache'})
              with urlopen(req,context=ssl.create_default_context(),timeout=90) as response:data=json.load(response)
              print('HOST_SMS_READ_ONLY '+json.dumps(data),flush=True)
          finally:
              try:r.remove_created(target);print('TEMPORARY_DIAGNOSTIC_REMOVED',flush=True)
              finally:
                  try:f.quit()
                  except Exception:f.close()
          print('NO_SMS_SENT')
          
          PY
