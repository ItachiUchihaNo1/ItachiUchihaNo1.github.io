name: Deploy Naamiraa Enamad footer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naamiraa-enamad.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: naamiraa-production-domains
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENAMAD_SOURCE: 'afbf5205f76a0c21a9bf218a481e3fb953411a43'
      ENAMAD_PLAN: '[{"path":"public/assets/enamad.png","oldHash":null,"newHash":"31758cce9bea410d57d5b30c3a9914f9b748f1f1f64d3ee9448730bcd20b825c"},{"path":"views/layout.php","oldHash":"f0bda1c338852ef196678d5a8641b2a2cfcff1b8431d208a552597c49b244bed","newHash":"3abd12075e9bfc8892a347dc7599847295e19af9e0f094e9ea4d7fd9e78cd373"}]'
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USER: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: afbf5205f76a0c21a9bf218a481e3fb953411a43
          path: namira-source
          persist-credentials: false
      - name: Validate PHP and prepare browser
        run: |
          php -l namira-source/namira/app/Security.php
          php -l namira-source/namira/views/layout.php
          npm install --prefix /tmp/namira-enamad playwright
          /tmp/namira-enamad/node_modules/.bin/playwright install --with-deps chromium
      - name: Back up deploy and verify footer on live pages
        run: |
          python3 -u - <<'PY'
          import os,sys,json,ssl,hashlib
          from pathlib import Path
          from urllib.request import Request,urlopen
          sys.path.insert(0,'namira-source/namira/deploy')
          import domains as d
          source=os.environ['ENAMAD_SOURCE'];plan=json.loads(os.environ['ENAMAD_PLAN']);release='fdf54bc5ecbed81eecd05be44247ce820e3d3cd1-d2229918ef57';prefix='_namira_live/releases/'+release
          f=d.FTP_TLS(context=ssl.create_default_context(),timeout=60);f.connect(os.environ['DEPLOY_FTPS_HOST'],21);f.login(os.environ['DEPLOY_FTPS_USER'],os.environ['DEPLOY_FTPS_PASSWORD']);f.prot_p();r=d.Remote(f);backup='_namira_live/backups/enamad-local-'+source[:12];changed=[];before={}
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          try:
              assert release.encode() in r.read('_namira_live/current.php'),'Unexpected release'
              jobs=[]
              for item in plan:
                  raw=Path('namira-source/namira/'+item['path']).read_bytes();assert sha(raw)==item['newHash'],'Source mismatch'
                  targets=[folder+'/'+item['path'][7:] for folder in ['public_html','admin.naamiraa.ir']] if item['path'].startswith('public/') else [prefix+'/'+item['path']]
                  for target in targets:
                      old=r.maybe(target)
                      if old is None:assert item['oldHash'] is None,'Existing file absent'
                      else:assert sha(old) in [item['oldHash'],item['newHash']],'Unexpected existing revision'
                      before[target]=old;jobs.append((target,raw,item['path']))
                      if old is not None:r.put(backup+'/'+target,old,True)
              for target,raw,relative in jobs:
                  if before[target]!=raw:r.put(target,raw,not relative.startswith('public/'));changed.append(target)
                  assert r.read(target)==raw,'Readback mismatch'
              with urlopen('https://naamiraa.ir/assets/enamad.png?v=20261108',context=ssl.create_default_context(),timeout=60) as response:
                  assert response.status==200 and sha(response.read())==plan[0]['newHash'],'Live image mismatch'
              for route in ['/','/images','/martyrs','/shop']:
                  with urlopen(Request('https://naamiraa.ir'+route,headers={'Cache-Control':'no-cache'}),context=ssl.create_default_context(),timeout=60) as response:
                      html=response.read().decode();assert response.status==200
                  footer=html.split('<footer>',1)[1].split('</footer>',1)[0]
                  assert 'src="/assets/enamad.png?v=20261108"' in footer and 'https://trustseal.enamad.ir/?id=8597340' in footer,'Footer link/image mismatch'
              result={'source':source,'backup':backup,'files_changed':len(changed),'verified_public_pages':4,'local_image_http':200,'schema_changed':False}
              Path('enamad-release.json').write_text(json.dumps(result,indent=2));print('ENAMAD_LOCAL_RELEASE_VERIFIED '+json.dumps(result),flush=True)
          except Exception:
              for target in reversed(changed):
                  try:
                      if before[target] is None:r.remove_created(target)
                      else:r.put(target,before[target],not target.startswith(('public_html/','admin.naamiraa.ir/')))
                  except Exception:print('RESTORE_NEEDS_CHECK '+target,flush=True)
              raise
          finally:
              try:f.quit()
              except Exception:f.close()
          
          PY
      - name: Check live mobile and desktop logo
        run: |
          cat > /tmp/enamad-check.cjs <<'JS'
          const fs=require('node:fs'),{chromium}=require('/tmp/namira-enamad/node_modules/playwright');
          (async()=>{const b=await chromium.launch();try{const p=await b.newPage();const result=[];for(const width of [390,1280]){await p.setViewportSize({width,height:900});await p.goto('https://naamiraa.ir/',{waitUntil:'domcontentloaded'});const logo=p.locator('footer .footer-trust img');await logo.scrollIntoViewIfNeeded();await logo.waitFor();await p.waitForFunction(()=>document.querySelector('footer .footer-trust img').complete,{},{timeout:25000}).catch(()=>{});const data=await logo.evaluate(el=>({complete:el.complete,loaded:el.naturalWidth>0,width:el.getBoundingClientRect().width,referrer:el.referrerPolicy}));if(!data.loaded||data.width>120||data.referrer!=='origin')throw Error('Badge layout regression');if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1))throw Error('Horizontal overflow');const link=p.locator('footer .footer-trust a');if((await link.getAttribute('target'))!=='_blank')throw Error('Target mismatch');result.push({viewport:width,...data});await p.screenshot({path:'enamad-'+width+'.png',fullPage:false});}fs.writeFileSync('enamad-browser.json',JSON.stringify(result));console.log('ENAMAD_BROWSER '+JSON.stringify(result));}finally{await b.close();}})().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node /tmp/enamad-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naamiraa-enamad-verification
          path: |
            enamad-release.json
            enamad-browser.json
            enamad-*.png
          retention-days: 14
