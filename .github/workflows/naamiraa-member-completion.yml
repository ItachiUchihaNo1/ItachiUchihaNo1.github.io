name: Deploy Naamiraa member completion fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/naamiraa-member-completion.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: naamiraa-production-domains
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_SOURCE: '89fd584b561a3caf03e91c1d351aa497ec673244'
      AUTH_PLAN: '[{"path":"app/AccountUi.php","oldHash":"a40f9fd20d6bb3e0604c0b4f4adcb64f11a1839fb22a36b84048ce0426d054c5","newHash":"5d13f06ddeb7fe5eabf8dd41ddccaa8e40e942bd5a69425fdbaac0be1c92d607"},{"path":"views/mobile-login.php","oldHash":"8270336bb3290ab0b9485829854bb1861a6b73fa87f8ebfb4891fbf18ae5862f","newHash":"65ffdad457f2a127c30cdb4d46cc16f9d271d03f172a3071d2cb24fddd534824"}]'
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USER: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: 89fd584b561a3caf03e91c1d351aa497ec673244
          path: namira-source
          persist-credentials: false
      - name: Require exact-source auth checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,time
          sha=os.environ['AUTH_SOURCE']
          for attempt in range(36):
              req=urllib.request.Request('https://api.github.com/repos/ItachiUchihaNo1/heiat-network/actions/runs?head_sha='+sha+'&per_page=20',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'Namira-auth-release','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:runs=json.load(response)['workflow_runs']
              matches=[r for r in runs if r['name']=='Namira member completion checks' and r['head_sha']==sha]
              if any(r['conclusion']=='success' for r in matches):break
              if matches and all(r['status']=='completed' for r in matches):raise RuntimeError('Exact-source authentication tests failed')
              time.sleep(10)
          else:raise RuntimeError('Passing exact-source authentication checks required')
          PY
      - name: Back up and deploy authentication fix
        run: |
          python3 -u - <<'PY'
          import os,sys,json,ssl,hashlib,secrets,re
          from pathlib import Path
          from urllib.request import Request,urlopen
          sys.path.insert(0,'namira-source/namira/deploy')
          import domains as d
          source=os.environ['AUTH_SOURCE'];plan=json.loads(os.environ['AUTH_PLAN']);release='fdf54bc5ecbed81eecd05be44247ce820e3d3cd1-d2229918ef57';prefix='_namira_live/releases/'+release
          f=d.FTP_TLS(context=ssl.create_default_context(),timeout=60);f.connect(os.environ['DEPLOY_FTPS_HOST'],21);f.login(os.environ['DEPLOY_FTPS_USER'],os.environ['DEPLOY_FTPS_PASSWORD']);f.prot_p();r=d.Remote(f);backup='_namira_live/backups/sales-min-password-'+source[:12];before={};changed=[];probe_path=None
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          def http(url,headers=None):
              with urlopen(Request(url,headers={'Cache-Control':'no-cache',**(headers or {})}),context=ssl.create_default_context(),timeout=120) as response:return response.status,response.read()
          try:
              assert release.encode() in r.read('_namira_live/current.php'),'Unexpected release'
              config=r.read('_namira_live/config.local.json')
              for item in plan:
                  target=prefix+'/'+item['path'];raw=Path('namira-source/namira/'+item['path']).read_bytes();assert digest(raw)==item['newHash']
                  old=r.read(target);assert digest(old) in [item['oldHash'],item['newHash']],'Unexpected installed revision';before[target]=old;r.put(backup+'/'+item['path'],old,True)
              for item in plan:
                  target=prefix+'/'+item['path'];raw=Path('namira-source/namira/'+item['path']).read_bytes()
                  if before[target]!=raw:r.put(target,raw,True);changed.append(target)
                  assert r.read(target)==raw
              token=secrets.token_hex(32);name='_namira-sales-'+secrets.token_hex(16)+'.php';probe_path='admin.naamiraa.ir/'+name
              php="""<?php
          declare(strict_types=1);ini_set('display_errors','0');set_time_limit(110);
          if(!hash_equals('__HASH__',hash('sha256',$_SERVER['HTTP_X_NAMIRA_SALES']??''))){http_response_code(404);exit;}
          define('NAMIRA_SURFACE','admin');define('NAMIRA_SHARED_PATH',dirname(__DIR__).'/_namira_live');require NAMIRA_SHARED_PATH.'/current.php';
          header('Content-Type: application/json');header('Cache-Control: no-store');$db=Namira\\Db::connect();
          $actor=Namira\\Db::query($db,"SELECT id,role,email FROM users WHERE role='superadmin' AND active=1 ORDER BY id LIMIT 1")->fetch();if(!$actor)throw new RuntimeException('No maintenance administrator');
          $_SESSION=['user_id'=>$actor['id']];$old=Namira\\StoreSettings::get($db);
          $oldRaw=Namira\\Db::query($db,"SELECT value FROM app_settings WHERE setting_key='store_v21'")->fetchColumn();
          $p=Namira\\Env::storage().'/backups/before-sales-enable-__SOURCE__.json';if(!is_file($p)){file_put_contents($p,Namira\\Protocol::encode(['setting_key'=>'store_v21','value'=>$oldRaw,'at'=>date(DATE_ATOM)]),LOCK_EX);chmod($p,0600);}
          if(!$old['enable_sales'])Namira\\StoreSettings::save($db,$actor,['enable_sales'=>true]);
          $connection='not_configured';$connectionError='';
          if(Namira\\BaleClient::configured()){
           try{Namira\\BalePayments::setup($db,$actor,false);$connection='connected';}
           catch(Namira\\HttpError $e){$connection='needs_attention';$connectionError=$e->getMessage();}
           catch(Throwable $e){$connection='needs_attention';$connectionError='بررسی اتصال کامل نشد.';}
          }
          $settings=Namira\\StoreSettings::get($db);$proof=['sales_enabled'=>(bool)$settings['enable_sales'],'sales_terms_present'=>trim($settings['sales_terms'])!=='','bale_configured'=>Namira\\BaleClient::configured(),'bale_activated'=>Namira\\BalePayments::available(),'connection'=>$connection,'connection_error'=>$connectionError,'orders'=>(int)Namira\\Db::query($db,'SELECT COUNT(*) FROM orders')->fetchColumn(),'real_payments'=>0,'real_sms_sent'=>0];
          ob_start();view('mobile-login',['db'=>$db,'actor'=>false,'proof'=>['purpose'=>'login','mobile'=>'09999999999','verified_until'=>time()+120],'challenge'=>null,'mode'=>'register','old'=>[]]);$html=ob_get_clean();
          $proof['minimum_six_fields']=substr_count($html,'minlength="6" maxlength="1024"')===2;
          $proof['numeric_restriction_removed']=!str_contains($html,'inputmode="numeric"')&&!str_contains($html,'pattern=');
          echo json_encode($proof,JSON_UNESCAPED_UNICODE);
          """
              php=php.replace('__HASH__',hashlib.sha256(token.encode()).hexdigest()).replace('__SOURCE__',source[:12])
              r.put(probe_path,php.encode(),False)
              code,body=http('https://admin.naamiraa.ir/'+name,{'X-Namira-Sales':token});proof=json.loads(body);assert code==200 and proof['sales_enabled'] and proof['minimum_six_fields'] and proof['numeric_restriction_removed'],'Settings/form verification failed'
              assert r.read('_namira_live/config.local.json')==config,'Private configuration changed'
              for route in ['/login','/shop','/cart']:
                  code,body=http('https://naamiraa.ir'+route);assert code==200,'Public route regression'
              result={'source':source,'backup':backup,'files_changed':len(changed),'proof':proof,'schema_changed':False,'config_changed':False}
              Path('sales-password-release.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));print('SALES_PASSWORD_RELEASE_VERIFIED '+json.dumps(result,ensure_ascii=False),flush=True)
          except Exception:
              for target in reversed(changed):
                  try:r.put(target,before[target],True)
                  except Exception:print('RESTORE_NEEDS_CHECK '+target,flush=True)
              raise
          finally:
              if probe_path:r.remove_created(probe_path);print('TEMPORARY_PROBE_REMOVED',flush=True)
              try:f.quit()
              except Exception:f.close()
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naamiraa-member-completion-release
          path: sales-password-release.json
          retention-days: 14
