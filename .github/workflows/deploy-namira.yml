name: Deploy Namira using existing cPanel connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-namira.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namira-test-shahidpics-existing-connection
  cancel-in-progress: false
jobs:
  deploy-namira:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USERNAME: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
      DEPLOY_FTPS_PORT: ${{ vars.DEPLOY_FTPS_PORT || '21' }}
      DEPLOY_FTPS_DIR: ${{ vars.NAMIRA_FTPS_DIR || 'Public_html/new' }}
      DEPLOY_SITE_URL: https://test.shahidpics.com
      NAMIRA_RELEASE_ID: eee8ec866b9b2d3d890e4d7a8b6864cb8d824e2d
    steps:
      - name: Read validated Namira source from heiat-network
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: eee8ec866b9b2d3d890e4d7a8b6864cb8d824e2d
          path: namira-source
          persist-credentials: false
      - name: Validate deployment script
        run: python3 -m py_compile namira-source/namira/deploy/ftps.py
      - name: Deploy only Namira to its own document root
        run: python3 namira-source/namira/deploy/ftps.py


      - name: Verify shared mobile navigation and existing public routes
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          BASE='https://test.shahidpics.com'
          class Nav(HTMLParser):
              def __init__(self):
                  super().__init__();self.inside=False;self.links=[];self.active=0;self.drawer=False;self.toggle=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='nav' and 'nm-bottom-nav' in a.get('class',''):self.inside=True
                  if tag=='a' and self.inside:
                      self.links.append(a.get('href',''))
                      if a.get('aria-current')=='page':self.active+=1
                  if tag=='dialog' and a.get('id')=='mobile-navigation':self.drawer=True
                  if tag=='button' and 'data-mobile-menu' in a:self.toggle=True
              def handle_endtag(self,tag):
                  if tag=='nav':self.inside=False
          def read(path):
              with urlopen(Request(BASE+path,headers={'Cache-Control':'no-cache','User-Agent':'Namira-mobile-nav-release-check'}),timeout=35) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          expected=['home','gallery','artists','shop','member-login']
          for page in ['home','gallery','artists','shop','member-login']:
              body=read('/index.php?page='+page);html=body.decode('utf-8');nav=Nav();nav.feed(html)
              assert nav.links==['/index.php?page='+p for p in expected],(page,nav.links)
              assert nav.active==1 and nav.drawer and nav.toggle,page
              assert 'بانک شهدا</span>' not in html
              assert 'Warning:' not in html and 'Fatal error:' not in html
              print('LIVE_MOBILE_NAV '+page+' HTTP200; five destinations, active item and drawer verified.')
          for name in ['mobile-navigation.css','mobile-navigation.js']:
              local=pathlib.Path('namira-source/namira/public/assets')/name
              for suffix in ['', '?v=20261029-1']:
                  raw=read('/assets/'+name+suffix)
                  assert hashlib.sha256(raw).digest()==hashlib.sha256(local.read_bytes()).digest(),name
              print('LIVE_NAV_ASSET '+name+' bare and actual version URL hash verified.')
          read('/index.php?page=store-info&section=sales_terms')
          gallery=json.loads(read('/index.php?page=gallery-data&mode=preview'));assert gallery['ok'] and isinstance(gallery['count'],int)
          try:
              read('/_namira/.env.example');raise AssertionError('Private path exposed')
          except HTTPError as e:assert e.code==403
          print('LIVE_NAVIGATION_RELEASE_VERIFIED; store route ready, gallery count='+str(gallery['count'])+'; private directory403. No records written.')
          
          PY
