name: Deploy Namira using existing cPanel connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-namira.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namira-test-shahidpics-existing-connection
  cancel-in-progress: false
jobs:
  deploy-namira:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEPLOY_FTPS_HOST: ${{ secrets.DEPLOY_FTPS_HOST }}
      DEPLOY_FTPS_USERNAME: ${{ secrets.DEPLOY_FTPS_USER }}
      DEPLOY_FTPS_PASSWORD: ${{ secrets.DEPLOY_FTPS_PASSWORD }}
      DEPLOY_FTPS_PORT: ${{ vars.DEPLOY_FTPS_PORT || '21' }}
      DEPLOY_FTPS_DIR: Public_html/new
      DEPLOY_SITE_URL: https://test.shahidpics.com
      NAMIRA_RELEASE_ID: f761afc6ddff0b26876081827f7d3df4e949ef29
    steps:
      - name: Read validated Namira source from heiat-network
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ItachiUchihaNo1/heiat-network
          ref: f761afc6ddff0b26876081827f7d3df4e949ef29
          path: namira-source
          persist-credentials: false
      - name: Validate deployment script
        run: python3 -m py_compile namira-source/namira/deploy/ftps.py
      - name: Require successful checks for the exact source revision
        run: |
          python3 - <<'PY'
          import json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/ItachiUchihaNo1/heiat-network/actions/runs/40854605461',headers={'User-Agent':'Namira-calls-deployment'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          assert data['head_sha']=='f761afc6ddff0b26876081827f7d3df4e949ef29' and data['conclusion']=='success', 'Exact-source Namira CI must succeed before upload'
          print('Exact source CI confirmed: PHP/MySQL, calls browser, store and mobile navigation.')
          PY
      - name: Diagnose test subdomain and verify hosting origin without bypassing TLS
        run: |
          python3 - <<'PY'
          import socket,os,ssl,urllib.request,json,subprocess
          host='test.shahidpics.com';origin=socket.gethostbyname(os.environ['DEPLOY_FTPS_HOST'])
          try: public=socket.gethostbyname_ex(host);print('PUBLIC_DNS '+json.dumps(public))
          except socket.gaierror as e: print('PUBLIC_DNS_UNAVAILABLE '+str(e))
          for query in [('NS','shahidpics.com'),('A',host),('AAAA',host),('CNAME',host)]:
              try:
                  r=subprocess.run(['dig','@1.1.1.1',query[1],query[0],'+noall','+comments','+answer','+authority','+time=3','+tries=1'],capture_output=True,text=True,timeout=5)
                  print('DNS_QUERY '+query[0]+' '+query[1]+' '+r.stdout.strip())
              except Exception as e: print('DNS_QUERY_UNAVAILABLE '+type(e).__name__)
          old=socket.getaddrinfo
          def resolve(name,port,*args,**kwargs): return old(origin if name==host else name,port,*args,**kwargs)
          socket.getaddrinfo=resolve
          with urllib.request.urlopen(urllib.request.Request('https://'+host+'/index.php?page=home',headers={'User-Agent':'Namira-origin-read-only-check'}),timeout=35,context=ssl.create_default_context()) as r:
              html=r.read().decode('utf-8');assert r.status==200 and 'نامیرا' in html and 'Fatal error:' not in html
          print('ORIGIN_VHOST_VERIFIED '+origin+' HTTPS200; original domain SNI, Host and certificate validation preserved.')
          PY
      - name: Deploy only Namira to its own document root
        run: python3 namira-source/namira/deploy/ftps.py


      - name: Verify active calls release and preserve private migration evidence
        run: |
          python3 - <<'PY'
          import os,ssl,io,re,json,hashlib,pathlib
          from ftplib import FTP_TLS
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          f=FTP_TLS(context=ssl.create_default_context(),timeout=60)
          f.connect(os.environ['DEPLOY_FTPS_HOST'],int(os.environ['DEPLOY_FTPS_PORT']))
          f.login(os.environ['DEPLOY_FTPS_USERNAME'],os.environ['DEPLOY_FTPS_PASSWORD']);f.prot_p();f.cwd('Public_html/new')
          def read(name):
              b=io.BytesIO();f.retrbinary('RETR '+name,b.write);return b.getvalue()
          index=read('index.php').decode('ascii');match=re.search(r"_namira/releases/(f761afc6ddff0b26876081827f7d3df4e949ef29-[a-f0-9]{12})/app/bootstrap.php",index)
          assert match,'Expected call release was not activated'
          release=match.group(1);root='_namira/releases/'+release
          paths={'assets/calls.js':'public/assets/calls.js','assets/calls.css':'public/assets/calls.css',root+'/app/CallSchema.php':'app/CallSchema.php',root+'/app/CallEntries.php':'app/CallEntries.php',root+'/views/call-submit.php':'views/call-submit.php',root+'/views/layout.php':'views/layout.php'}
          for remote,local in paths.items():
              assert hashlib.sha256(read(remote)).digest()==hashlib.sha256((pathlib.Path('namira-source/namira')/local).read_bytes()).digest(),remote
          reports=[name for name,meta in f.mlsd('_namira/storage/backups') if name.startswith('migration-012-') and name.endswith('.json')]
          migration=None
          if reports:
              m=json.loads(read('_namira/storage/backups/'+sorted(reports)[-1]));assert all(m['after'][k]==v for k,v in m['before'].items());migration={'report':sorted(reports)[-1],'before_rows':sum(m['before'].values()),'after_rows':sum(m['after'].values()),'existing_rows_rewritten':m['existing_rows_rewritten']}
          f.quit()
          public={}
          for page in ['home','calls']:
              try:
                  with urlopen(Request('https://test.shahidpics.com/index.php?page='+page,headers={'User-Agent':'Namira-calls-release-check','Cache-Control':'no-cache'}),timeout=30) as r:
                      html=r.read().decode('utf-8');public[page]={'status':r.status,'calls_ui':('/assets/calls.js' in html) if page=='calls' else None};assert 'Fatal error:' not in html and 'Warning:' not in html
              except (HTTPError,URLError) as e: public[page]={'status':getattr(e,'code',None),'verification_pending':True}
          result={'source':'f761afc6ddff0b26876081827f7d3df4e949ef29','release':release,'target':'Public_html/new','readback_files':len(paths),'migration':migration,'migration_pending':migration is None,'public':public,'production_changed':False}
          print('CALLS_RELEASE_RESULT '+json.dumps(result,ensure_ascii=False));pathlib.Path('calls-release-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namira-calls-release
          path: calls-release-result.json
          retention-days: 14
