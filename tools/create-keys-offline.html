<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><title>ساخت کلیدهای نصب مرشد</title><style>body{font:16px Tahoma;line-height:2;max-width:760px;padding:24px;margin:auto}button{background:#087f7a;color:white;padding:15px;border:0;border-radius:12px;font:inherit}label{display:block;margin-top:20px}textarea{width:100%;min-height:80px;direction:ltr;box-sizing:border-box}p{background:#e7f4ef;padding:14px;border-radius:12px}</style></head><body><h1>ساخت کلیدهای خصوصی نصب</h1><p>این فایل را روی رایانه خودتان باز کنید. شبکه و ذخیره‌سازی مرورگر ندارد. مقدارها را در چت نفرستید.</p><button id="generate">ساخت کلیدهای تصادفی</button><label for="app">app_key — در فایل خصوصی local.php</label><textarea id="app" readonly></textarea><label for="token">کلید نصب — فقط در فرم ساخت اولین مدیر</label><textarea id="token" readonly></textarea><label for="hash">setup.token_sha256 — در فایل خصوصی local.php</label><textarea id="hash" readonly></textarea><p id="status" role="status">کلید نصب و app_key دو مقدار مستقل هستند.</p><script>
document.getElementById('generate').addEventListener('click',async()=>{try{const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');const key=hex(crypto.getRandomValues(new Uint8Array(32)));const token=hex(crypto.getRandomValues(new Uint8Array(32)));const digest=hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token))));document.getElementById('app').value=key;document.getElementById('token').value=token;document.getElementById('hash').value=digest;document.getElementById('status').textContent='ساخته شد. app_key را پس از نصب ثابت نگه دارید. بعد از ایجاد مدیر، setup.enabled را false و setup.token_sha256 را خالی کنید.';}catch{document.getElementById('status').textContent='مرورگر امکان تولید امن کلید ندارد؛ فایل را در مرورگر به‌روز روی رایانه باز کنید.';}});
</script></body></html>
