<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پایش هیأت‌ها</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#14100e;
  --bg-2:#0f0c0a;
  --surface:#1d1512;
  --surface-2:#251b16;
  --surface-3:#2c2019;
  --wine:#8a2f3c;
  --wine-light:#b5525f;
  --wine-deep:#5c1e28;
  --gold:#c99a4e;
  --gold-light:#e3c07f;
  --green:#3a6656;
  --text:#f3ece1;
  --text-muted:#b8a692;
  --text-dim:#8a7a68;
  --border:rgba(230,205,170,0.12);
  --border-strong:rgba(230,205,170,0.22);
  --shadow: 0 12px 40px rgba(0,0,0,0.45);
  --radius: 14px;
  --font: 'Vazirmatn', 'IRANSans', 'Tahoma', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(138,47,60,0.18), transparent 60%),
    radial-gradient(1000px 500px at 110% 10%, rgba(201,154,78,0.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font);
  min-height:100vh;
  direction:rtl;
}
::selection{background:var(--wine);color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font);cursor:pointer;}
input,textarea,select{font-family:var(--font);}

/* --- decorative repeating divider, evokes stitched banner trim --- */
.trim{
  height:6px;
  background-image: repeating-linear-gradient(135deg, var(--gold) 0 8px, transparent 8px 16px);
  opacity:0.55;
}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

header.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, rgba(20,16,14,0.97), rgba(20,16,14,0.90));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1280px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-mark{
  width:38px;height:44px;position:relative;flex:none;
  background:linear-gradient(160deg,var(--wine),var(--wine-deep));
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
  box-shadow: inset 0 0 0 1px rgba(230,205,170,0.25);
}
.brand-mark::after{
  content:"";position:absolute;inset:6px 6px 14px 6px;
  border:1px solid var(--gold-light);opacity:0.6;
}
.brand-text .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--gold-light);text-transform:uppercase;}
.brand-text h1{margin:0;font-size:19px;font-weight:800;color:var(--text);}
.brand-text .sub{font-size:12px;color:var(--text-dim);}

.searchbox{
  flex:1 1 260px;max-width:420px;position:relative;
}
.searchbox input{
  width:100%;padding:10px 40px 10px 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-size:13.5px;outline:none;transition:border-color .15s;
}
.searchbox input:focus{border-color:var(--gold);}
.searchbox svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:0.55;}
.search-results{
  position:absolute;top:calc(100% + 8px);right:0;left:0;
  background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;
  max-height:360px;overflow:auto;box-shadow:var(--shadow);z-index:60;
}
.search-results .sr-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.search-results .sr-item:hover{background:var(--surface-3);}
.search-results .sr-item small{color:var(--text-dim);}
.search-results .sr-empty{padding:16px;color:var(--text-dim);font-size:13px;text-align:center;}

.topbar-actions{display:flex;gap:10px;align-items:center;margin-right:auto;flex-wrap:wrap;}
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:all .15s;
}
.btn:hover{border-color:var(--gold);color:var(--gold-light);}
.btn-primary{background:linear-gradient(160deg,var(--wine),var(--wine-deep));border-color:transparent;color:#fff;}
.btn-primary:hover{filter:brightness(1.1);color:#fff;box-shadow:0 6px 20px rgba(138,47,60,0.4);}
.btn-gold{background:linear-gradient(160deg,var(--gold),#a97e37);border-color:transparent;color:#241a0f;}
.btn-gold:hover{filter:brightness(1.08);color:#241a0f;}
.btn-ghost{background:transparent;border-color:var(--border);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

main{flex:1;max-width:1280px;margin:0 auto;padding:26px 20px 60px;width:100%;}

footer.appfoot{text-align:center;padding:24px;color:var(--text-dim);font-size:11.5px;border-top:1px solid var(--border);}

/* ---------- Upload screen ---------- */
.upload-wrap{
  min-height:70vh;display:flex;align-items:center;justify-content:center;
}
.upload-card{
  max-width:560px;width:100%;text-align:center;padding:44px 34px;
  background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.upload-card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(500px 200px at 50% -20%, rgba(201,154,78,0.16), transparent 60%);
  pointer-events:none;
}
.upload-icon{
  width:64px;height:64px;margin:0 auto 18px;border-radius:16px;
  background:linear-gradient(160deg,var(--wine),var(--wine-deep));
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(230,205,170,0.25);
}
.upload-card h2{margin:0 0 8px;font-size:22px;}
.upload-card p{color:var(--text-muted);font-size:14px;line-height:1.9;margin:0 0 22px;}
.dropzone{
  border:1.5px dashed var(--border-strong);border-radius:16px;padding:30px 18px;
  color:var(--text-dim);font-size:13px;transition:all .15s;cursor:pointer;
}
.dropzone.drag{border-color:var(--gold);background:rgba(201,154,78,0.06);color:var(--gold-light);}
.dropzone b{color:var(--gold-light);}
.upload-error{margin-top:14px;color:var(--wine-light);font-size:13px;}
.upload-progress{margin-top:14px;color:var(--text-dim);font-size:13px;}

/* ---------- Sections / Cards ---------- */
.section{margin-bottom:34px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:17px;margin:0;display:flex;align-items:center;gap:8px;}
.section-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--gold-light);text-transform:uppercase;display:block;margin-bottom:4px;}
.view-toggle{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px;}
.view-toggle button{background:transparent;border:none;color:var(--text-dim);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;}
.view-toggle button.active{background:var(--surface-3);color:var(--gold-light);}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:30px;}
@media(max-width:820px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
  position:relative;overflow:hidden;
}
.stat-card::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--wine));}
.stat-card .num{font-size:28px;font-weight:800;color:var(--text);}
.stat-card .lbl{font-size:12.5px;color:var(--text-muted);margin-top:4px;}

.grid-provinces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.prov-cell{
  border-radius:12px;padding:14px 14px 12px;border:1px solid var(--border);cursor:pointer;
  transition:transform .15s, border-color .15s; position:relative;
}
.prov-cell:hover{transform:translateY(-3px);border-color:var(--gold);}
.prov-cell .pname{font-size:13.5px;font-weight:700;margin-bottom:6px;}
.prov-cell .pcount{font-size:20px;font-weight:800;}
.prov-cell .pbar{height:4px;border-radius:3px;background:rgba(0,0,0,0.25);margin-top:8px;overflow:hidden;}
.prov-cell .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine-light));}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
table.data-table th{text-align:right;padding:12px 14px;background:var(--surface-2);color:var(--gold-light);font-weight:700;font-size:12px;border-bottom:1px solid var(--border);}
table.data-table td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text-muted);}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr.row-click{cursor:pointer;}
table.data-table tr.row-click:hover td{background:var(--surface-2);color:var(--text);}
table.data-table td b{color:var(--text);}

.chart-type-wrap{display:grid;grid-template-columns:280px 1fr;gap:26px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;}
@media(max-width:720px){.chart-type-wrap{grid-template-columns:1fr;}}
.type-legend{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;}
.type-legend .tl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13px;}
.type-legend .tl-item:hover{background:var(--surface-2);}
.type-legend .dot{width:10px;height:10px;border-radius:3px;flex:none;}
.type-legend .tl-name{flex:1;color:var(--text);}
.type-legend .tl-count{color:var(--text-dim);font-size:12px;}

/* ---------- List page ---------- */
.list-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.filter-input, .filter-select{
  padding:9px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;
}
.filter-input{flex:1;min-width:180px;}
.filter-input:focus,.filter-select:focus{border-color:var(--gold);}
.result-count{color:var(--text-dim);font-size:12.5px;margin-inline-start:auto;}

.cards-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
.heyat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;
  transition:border-color .15s, transform .15s;position:relative;
}
.heyat-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.hc-top{display:flex;gap:12px;align-items:center;}
.hc-avatar{
  width:44px;height:50px;flex:none;background:var(--surface-3);
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--gold-light);font-size:15px;
  background-size:cover;background-position:center;
}
.hc-name{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.4;}
.hc-meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
.hc-badge{
  display:inline-block;margin-top:10px;font-size:11px;padding:3px 10px;border-radius:999px;
  background:rgba(201,154,78,0.13);color:var(--gold-light);border:1px solid rgba(201,154,78,0.3);
}
.pager{display:flex;gap:8px;justify-content:center;margin-top:22px;align-items:center;color:var(--text-dim);font-size:13px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-state svg{opacity:0.4;margin-bottom:10px;}

/* ---------- Detail page ---------- */
.breadcrumb{font-size:12.5px;color:var(--text-dim);margin-bottom:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.breadcrumb a:hover{color:var(--gold-light);}
.detail-hero{
  display:flex;gap:22px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:26px;margin-bottom:22px;flex-wrap:wrap;
}
.avatar-frame{position:relative;flex:none;}
.avatar-shape{
  width:110px;height:126px;background:var(--surface-3) center/cover no-repeat;
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);
  display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--gold-light);
  box-shadow:inset 0 0 0 1px rgba(230,205,170,0.25);
}
.avatar-upload-btn{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#241a0f;border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;
  box-shadow:0 4px 10px rgba(0,0,0,0.4);
}
.detail-info{flex:1;min-width:220px;}
.detail-info h1{margin:0 0 8px;font-size:23px;}
.badges-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.badge{font-size:11.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-muted);}
.badge.type{background:rgba(138,47,60,0.18);border-color:rgba(138,47,60,0.4);color:var(--wine-light);}
.badge.province{background:rgba(58,102,86,0.18);border-color:rgba(58,102,86,0.45);color:#7fbfa4;}
.badge.tip{background:rgba(201,154,78,0.18);border-color:rgba(201,154,78,0.45);color:var(--gold-light);}

/* ---------- Add form ---------- */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px;max-width:760px;margin:0 auto;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:12px;color:var(--gold-light);}
.form-field label .req{color:var(--wine-light);}
.form-field input,.form-field select,.form-field textarea{
  padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:13.5px;outline:none;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold);}
.form-field textarea{min-height:90px;resize:vertical;}
.form-note{font-size:12px;color:var(--text-dim);margin-bottom:20px;}
.form-actions{display:flex;gap:10px;justify-content:flex-start;}
.detail-info .addr{color:var(--text-muted);font-size:13.5px;line-height:1.9;margin-top:4px;}

.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
.info-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.info-box .lbl{font-size:11px;color:var(--gold-light);letter-spacing:.5px;margin-bottom:6px;}
.info-box .val{font-size:13.5px;color:var(--text);}

.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.social-btn{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text);
}
.social-btn:hover{border-color:var(--gold);color:var(--gold-light);}

.links-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.link-chip{font-size:11.5px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);}

.desc-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
.desc-box .lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.desc-box .lbl{font-size:11px;color:var(--gold-light);letter-spacing:.5px;}
.desc-box textarea{
  width:100%;min-height:140px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-size:13.5px;line-height:1.9;resize:vertical;outline:none;
}
.desc-box textarea:focus{border-color:var(--gold);}
.save-hint{font-size:11.5px;color:var(--text-dim);}
.save-hint.ok{color:#7fbfa4;}

.hidden{display:none !important;}

@media(max-width:600px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .detail-hero{flex-direction:column;align-items:center;text-align:center;}
  .topbar-inner{gap:10px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ======================= State ======================= */
const state = {
  records: [],
  byId: new Map(),
  provinceCounts: new Map(),
  typeCounts: new Map(),
  tipCounts: new Map(),
  enrichments: {},
  edits: {},
  loaded: false,
  fileName: '',
};

const PALETTE = ['#c99a4e','#8a2f3c','#3a6656','#b5525f','#e3c07f','#5c1e28','#7fbfa4','#a97e37','#c98484','#6f8f9d','#d1b17a','#9c5563'];
function colorFor(i){ return PALETTE[i % PALETTE.length]; }

/* ======================= Storage adapter ======================= */
/* اگر برنامه داخل Claude باز شده باشد از حافظهٔ ابری Claude (window.storage) استفاده
   می‌کند؛ اگر همین فایل به‌صورت مستقل (دانلودشده، روی سایت یا هاست خودتان) باز شود
   و آن حافظه در دسترس نباشد، به‌صورت خودکار روی localStorage همان مرورگر ذخیره
   می‌کند تا در هر حالت اطلاعات از بین نروند. */
const storageAdapter = (function(){
  const hasCloud = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
  if (hasCloud){
    return { kind:'cloud', get: (key)=>window.storage.get(key,false), set: (key,value)=>window.storage.set(key,value,false) };
  }
  let hasLocal = false;
  try{ localStorage.setItem('__heyat_test__','1'); localStorage.removeItem('__heyat_test__'); hasLocal = true; }catch(e){ hasLocal = false; }
  const mem = {};
  return {
    kind: hasLocal ? 'local' : 'memory',
    async get(key){
      if (hasLocal){
        const raw = localStorage.getItem('heyat_'+key);
        if (raw==null) throw new Error('key not found');
        return {key, value: raw};
      }
      if (!(key in mem)) throw new Error('key not found');
      return {key, value: mem[key]};
    },
    async set(key, value){
      if (hasLocal){ localStorage.setItem('heyat_'+key, value); return {key, value}; }
      mem[key]=value; return {key, value};
    },
  };
})();

/* ======================= Storage helpers ======================= */
async function loadEnrichments(){
  try{
    const r = await storageAdapter.get('heyat-enrichments');
    state.enrichments = r && r.value ? JSON.parse(r.value) : {};
  }catch(e){ state.enrichments = {}; }
}
async function saveEnrichments(){
  try{
    await storageAdapter.set('heyat-enrichments', JSON.stringify(state.enrichments));
    return true;
  }catch(e){ console.error('storage error', e); return false; }
}

async function loadManualRecords(){
  try{
    const r = await storageAdapter.get('heyat-manual-records');
    return r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveManualRecords(){
  try{
    const manual = state.records.filter(r=> r.source==='manual');
    await storageAdapter.set('heyat-manual-records', JSON.stringify(manual));
    return true;
  }catch(e){ console.error('storage error', e); return false; }
}

/* ویرایش‌های اعمال‌شده روی رکوردهای برآمده از اکسل، چون خودِ اکسل ذخیره نمی‌شود
   و هر بار باید دوباره بارگذاری شود، این ویرایش‌ها جدا نگه‌داری و روی داده‌ی
   تازه‌پارس‌شده اعمال می‌شوند. */
async function loadEdits(){
  try{
    const r = await storageAdapter.get('heyat-edits');
    state.edits = r && r.value ? JSON.parse(r.value) : {};
  }catch(e){ state.edits = {}; }
}
async function saveEdits(){
  try{
    await storageAdapter.set('heyat-edits', JSON.stringify(state.edits));
    return true;
  }catch(e){ console.error('storage error', e); return false; }
}
function applyStoredEdits(records){
  records.forEach(r=>{
    const patch = state.edits[r.id];
    if (patch) Object.assign(r, patch);
  });
  return records;
}
async function updateRecord(id, patch){
  const rec = state.byId.get(id);
  if (!rec) return false;
  Object.assign(rec, patch);
  buildAggregates();
  if (rec.source==='manual'){
    return await saveManualRecords();
  } else {
    state.edits[id] = Object.assign(state.edits[id]||{}, patch);
    return await saveEdits();
  }
}

/* ======================= Excel parsing ======================= */
const SKIP_SHEETS = new Set(['تجمیع','رصد']);

function findCol(headers, keyword){
  return headers.findIndex(h => h && h.indexOf(keyword) !== -1);
}

function parseWorkbook(workbook){
  const records = [];
  workbook.SheetNames.forEach(sheetName=>{
    if (SKIP_SHEETS.has(sheetName)) return;
    const ws = workbook.Sheets[sheetName];
    if (!ws) return;
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
    if (!rows.length) return;
    const headers = rows[0].map(h=> h==null ? '' : String(h).trim());
    const idx = {
      type: findCol(headers,'نوع'),
      name: findCol(headers,'نام'),
      city: findCol(headers,'شهر'),
      address: findCol(headers,'آدرس'),
      typeCode: findCol(headers,'تیپ'),
      instagram: findCol(headers,'اینستا'),
      telegram: findCol(headers,'تلگرام'),
      eita: findCol(headers,'ایتا'),
      youtube: findCol(headers,'یوتیوب'),
      aparat: findCol(headers,'آپارات'),
      website: findCol(headers,'سایت'),
      keyPerson: findCol(headers,'فرد شاخص'),
      weekly: findCol(headers,'هفتگی'),
      school: findCol(headers,'مدرسه'),
      charity: findCol(headers,'خیریه'),
      fund: findCol(headers,'صندوق'),
      mokeb: findCol(headers,'موکب'),
      jihadi: findCol(headers,'جهادی'),
    };
    if (idx.name === -1) return;
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      if (!row) continue;
      const nameVal = row[idx.name];
      if (nameVal==null || !String(nameVal).trim()) continue;
      const get = (i)=> (i>=0 && row[i]!=null) ? String(row[i]).trim() : '';
      const rec = {
        id: sheetName+'__'+r,
        province: sheetName,
        type: get(idx.type) || 'نامشخص',
        name: String(nameVal).trim(),
        city: get(idx.city),
        address: get(idx.address),
        instagram: get(idx.instagram),
        telegram: get(idx.telegram),
        eita: get(idx.eita),
        youtube: get(idx.youtube),
        aparat: get(idx.aparat),
        website: get(idx.website),
        keyPerson: get(idx.keyPerson),
        weekly: get(idx.weekly),
        links: {}
      };
      rec.tip = normalizeTip(get(idx.typeCode)) || 'نامشخص';
      ['school','charity','fund','mokeb','jihadi'].forEach(k=>{
        const v = get(idx[k]);
        if (v) rec.links[k]=v;
      });
      rec.source = 'excel';
      records.push(rec);
    }
  });
  return records;
}

/* ستون «تیپ» در فایل اصلی پر از خطاهای تایپی است (تاریخ‌های سرلک اکسل به‌جای عدد،
   خط تیره، ایموجی و...). این تابع فقط مقادیر واقعی و معنادار همان ستون را نگه می‌دارد. */
function normalizeTip(raw){
  if (raw==null) return '';
  let s = String(raw).trim();
  if (!s) return '';
  if (/^-+$/.test(s)) return '';
  if (/^-?\d+(\.0+)?$/.test(s)){
    const n = parseInt(s,10);
    if (Math.abs(n) > 100) return ''; // احتمالاً سریال تاریخ اکسل ناشی از خطای تایپی است
    return String(n);
  }
  const m = s.match(/^([0-9]{1,2})/);
  if (m) return m[1];
  return s;
}

function buildAggregates(){
  state.byId = new Map();
  state.provinceCounts = new Map();
  state.typeCounts = new Map();
  state.tipCounts = new Map();
  state.records.forEach(rec=>{
    state.byId.set(rec.id, rec);
    state.provinceCounts.set(rec.province, (state.provinceCounts.get(rec.province)||0)+1);
    state.typeCounts.set(rec.type, (state.typeCounts.get(rec.type)||0)+1);
    state.tipCounts.set(rec.tip||'نامشخص', (state.tipCounts.get(rec.tip||'نامشخص')||0)+1);
  });
}

function normalizeUrl(v){
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^(www\.|t\.me|instagram\.com|eitaa\.com)/i.test(v)) return 'https://'+v;
  if (v.indexOf('.')!==-1 && v.indexOf(' ')===-1) return 'https://'+v;
  return '';
}

function initials(name){
  const t = (name||'').trim();
  if (!t) return '؟';
  return t[0];
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

      </div>
      ${state.records.filter(r=>r.source==='manual').length ? `<div style="margin-top:10px;"><a href="#/dashboard" class="btn btn-ghost btn-sm">مشاهده ${state.records.filter(r=>r.source==='manual').length} هیأت دستی ثبت‌شده</a></div>` : ''}
    </div>`;
  const dz = wrap.querySelector('#dropzone');
  const fi = wrap.querySelector('#fileInput');
  const msg = wrap.querySelector('#uploadMsg');
  dz.onclick = ()=> fi.click();
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  fi.addEventListener('change', e=>{
    const f = e.target.files[0];
    if (f) handleFile(f);
  });

  function handleFile(file){
    msg.innerHTML = '<div class="upload-progress">در حال خواندن و پردازش فایل...</div>';
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:false});
        const records = parseWorkbook(wb);
        applyStoredEdits(records);
        if (!records.length){
          msg.innerHTML = '<div class="upload-error">هیچ رکورد معتبری در فایل پیدا نشد. ساختار فایل را بررسی کنید.</div>';
          return;
        }
        const manualKept = state.records.filter(r=> r.source==='manual');
        state.records = manualKept.concat(records);
        state.fileName = file.name;
        buildAggregates();
        state.loaded = true;
        location.hash = '#/dashboard';
        render();
      }catch(err){
        console.error(err);
        msg.innerHTML = '<div class="upload-error">خطا در خواندن فایل اکسل. لطفاً فایل صحیح را انتخاب کنید.</div>';
      }
    };
    reader.onerror = ()=>{ msg.innerHTML = '<div class="upload-error">خطا در بارگذاری فایل.</div>'; };
    reader.readAsArrayBuffer(file);
  }

  return wrap;
}

  const tipSection = document.createElement('div');
  tipSection.className='section';
  const sortedTips = [...state.tipCounts.entries()].sort((a,b)=> b[1]-a[1]);
  tipSection.innerHTML = `
    <div class="section-head"><h2><span class="eyebrow" style="display:block;">تیپ‌بندی (۱ تا ۹)</span>تعداد به تفکیک تیپ</h2></div>

      <canvas id="tipChart" width="280" height="280"></canvas>
      <div class="type-legend" id="tipLegend"></div>
    </div>`;
  wrap.appendChild(tipSection);

  const tipLegend = tipSection.querySelector('#tipLegend');
  tipLegend.innerHTML = sortedTips.map(([name,count],i)=>`
    <div class="tl-item" data-tip="${esc(name)}">
      <span class="dot" style="background:${colorFor(i+3)}"></span>
      <span class="tl-name">${esc(name)}</span>
      <span class="tl-count">${count.toLocaleString('fa-IR')}</span>
    </div>`).join('');
  tipLegend.querySelectorAll('.tl-item').forEach(el=> el.onclick = ()=>{ location.hash = '#/tip/'+encodeURIComponent(el.dataset.tip); });

  setTimeout(()=>{
    const ctx2 = tipSection.querySelector('#tipChart');
    if (ctx2 && window.Chart){
      new Chart(ctx2, {
        type:'bar',
        data:{ labels: sortedTips.map(t=>t[0]), datasets:[{ data: sortedTips.map(t=>t[1]), backgroundColor: sortedTips.map((_,i)=>colorFor(i+3)), borderRadius:6, maxBarThickness:26 }] },
        options:{
          indexAxis:'y',
          plugins:{ legend:{display:false} },
          scales:{ x:{ grid:{color:'rgba(230,205,170,0.08)'}, ticks:{color:'#b8a692'} }, y:{ grid:{display:false}, ticks:{color:'#f3ece1'} } }

  return wrap;
}

/* ======================= List page (province / type) ======================= */
const MODE_LABEL = {province:'استان', type:'نوع', tip:'تیپ'};
function renderListPage(mode, value){
  const wrap = document.createElement('div');
  const fieldOf = { province:'province', type:'type', tip:'tip' };
  const field = fieldOf[mode];
  let records = state.records.filter(r=> r[field]===value);
  const title = value;

  wrap.innerHTML = `
    <div class="breadcrumb"><a href="#/dashboard">داشبورد</a> ← <span>${MODE_LABEL[mode]}: ${esc(value)}</span></div>
    <div class="section-head"><h2>${esc(title)} <span style="color:var(--text-dim);font-weight:400;font-size:14px;">(${records.length.toLocaleString('fa-IR')} مورد)</span></h2>
      ${mode==='province' ? `<a href="#/add/${encodeURIComponent(value)}" class="btn btn-primary btn-sm">+ افزودن هیأت در ${esc(value)}</a>` : ''}
    </div>
    <div class="list-toolbar">
      <input type="text" class="filter-input" id="lf-q" placeholder="جست‌وجو در نام، شهر، آدرس...">
      <select class="filter-select" id="lf-sub"></select>
      ${mode==='province' ? `<a href="#/add/${encodeURIComponent(value)}" class="btn btn-primary btn-sm">+ افزودن هیأت جدید در ${esc(value)}</a>` : ''}
      <span class="result-count" id="lf-count"></span>
    </div>
    <div id="lf-body"></div>
    <div class="pager" id="lf-pager"></div>`;

  // فیلتر ثانویه: بعد از فیلتر اصلی، بعدی مفیدترین بُعد را نشان می‌دهیم
  const subField = mode==='province' ? 'type' : (mode==='type' ? 'province' : 'province');
  const subLabel = mode==='province' ? 'همهٔ نوع‌ها' : (mode==='type' ? 'همهٔ استان‌ها' : 'همهٔ استان‌ها');
  const subSelect = wrap.querySelector('#lf-sub');
  const subValues = [...new Set(records.map(r=>r[subField]))].filter(Boolean).sort();
  subSelect.innerHTML = `<option value="">${subLabel}</option>` + subValues.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');

  let page = 1;
  const PAGE_SIZE = 30;
  const qInput = wrap.querySelector('#lf-q');
  const body = wrap.querySelector('#lf-body');
  const countEl = wrap.querySelector('#lf-count');
  const pager = wrap.querySelector('#lf-pager');

  function filtered(){
    const q = qInput.value.trim().toLowerCase();
    const sub = subSelect.value;
    return records.filter(r=>{
      if (sub && r[subField]!==sub) return false;
      if (!q) return true;
      return r.name.toLowerCase().includes(q) || (r.city&&r.city.toLowerCase().includes(q)) || (r.address&&r.address.toLowerCase().includes(q)) || (r.keyPerson&&r.keyPerson.toLowerCase().includes(q));
    });
  }

  function paint(){
    const list = filtered();
    countEl.textContent = list.length.toLocaleString('fa-IR')+' نتیجه';
    const totalPages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
    if (page>totalPages) page = totalPages;
    const slice = list.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

    if (!slice.length){
      body.innerHTML = `<div class="empty-state">${ICONS.box}<div>موردی یافت نشد</div></div>`;
      pager.innerHTML='';
      return;
    }
    const grid = document.createElement('div');
    grid.className='cards-list';
    grid.innerHTML = slice.map(r=>{
      const enr = state.enrichments[r.id];
      const img = enr && enr.image;
      return `<div class="heyat-card" data-id="${esc(r.id)}">
        <div class="hc-top">
          <div class="hc-avatar" style="${img?`background-image:url('${img}')`:''}">${img?'':esc(initials(r.name))}</div>
          <div>
            <div class="hc-name">${esc(r.name)}</div>
            <div class="hc-meta">${esc(r.province)}${r.city?' · '+esc(r.city):''}</div>
          </div>
        </div>
        <span class="hc-badge">${esc(mode==='province'? r.type : (mode==='type' ? r.province : r.province))}</span>
      </div>`;
    }).join('');
    body.innerHTML=''; body.appendChild(grid);
    grid.querySelectorAll('.heyat-card').forEach(el=> el.onclick = ()=>{ location.hash = '#/heyat/'+encodeURIComponent(el.dataset.id); });

    pager.innerHTML = `
      <button class="btn btn-ghost btn-sm" id="pgPrev" ${page<=1?'disabled':''}>◀ قبلی</button>
      <span>صفحهٔ ${page.toLocaleString('fa-IR')} از ${totalPages.toLocaleString('fa-IR')}</span>
      <button class="btn btn-ghost btn-sm" id="pgNext" ${page>=totalPages?'disabled':''}>بعدی ▶</button>`;
    const prevBtn = pager.querySelector('#pgPrev'); if (prevBtn) prevBtn.onclick=()=>{ page--; paint(); window.scrollTo({top:0,behavior:'smooth'}); };
    const nextBtn = pager.querySelector('#pgNext'); if (nextBtn) nextBtn.onclick=()=>{ page++; paint(); window.scrollTo({top:0,behavior:'smooth'}); };
  }

  qInput.addEventListener('input', ()=>{ page=1; paint(); });
  subSelect.addEventListener('change', ()=>{ page=1; paint(); });
  paint();

  return wrap;
}

      <a href="#/province/${encodeURIComponent(rec.province)}">${esc(rec.province)}</a> ←

        </div>
        ${rec.address?`<div class="addr">📍 ${esc(rec.address)}</div>`:''}

    </div>

    <div class="info-grid">
      ${rec.keyPerson?`<div class="info-box"><div class="lbl">فرد شاخص</div><div class="val">${esc(rec.keyPerson)}</div></div>`:''}
      ${rec.weekly?`<div class="info-box"><div class="lbl">برنامهٔ هفتگی</div><div class="val">${esc(rec.weekly)}</div></div>`:''}
      <div class="info-box"><div class="lbl">استان</div><div class="val">${esc(rec.province)}</div></div>
      ${rec.city?`<div class="info-box"><div class="lbl">شهر</div><div class="val">${esc(rec.city)}</div></div>`:''}
      <div class="info-box"><div class="lbl">نوع</div><div class="val">${esc(rec.type)}</div></div>
      <div class="info-box"><div class="lbl">تیپ</div><div class="val">${esc(rec.tip||'نامشخص')}</div></div>
    </div>

    <div class="section-head"><h2>شبکه‌های اجتماعی</h2></div>
    <div class="social-row" id="socialRow"></div>

    ${Object.keys(rec.links).length?`<div class="section-head"><h2>وابسته‌ها</h2></div><div class="links-row" id="linksRow"></div>`:''}

    <div class="desc-box">
      <div class="lbl-row">
        <span class="lbl">توضیحات</span>
        <span class="save-hint" id="saveHint"></span>
      </div>
      <textarea id="descArea" placeholder="یادداشت یا توضیحات خود را دربارهٔ این هیأت اینجا بنویسید...">${esc(enr.desc||'')}</textarea>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" id="saveDescBtn">ذخیرهٔ توضیحات</button>
      </div>
    </div>

    ${rec.source==='manual' ? `
    <div style="margin-top:18px;text-align:left;">
      <button class="btn btn-ghost btn-sm" id="deleteBtn" style="border-color:var(--wine-light);color:var(--wine-light);">حذف این هیأت</button>
    </div>` : ''}
  `;

  // social buttons
  const socialRow = wrap.querySelector('#socialRow');
  const socials = ['instagram','telegram','eita','youtube','aparat','website'];
  let hasAny=false;
  socials.forEach(k=>{
    const raw = rec[k];
    if (!raw) return;
    hasAny=true;
    const url = normalizeUrl(raw);
    const btn = document.createElement(url?'a':'span');
    btn.className='social-btn';
    if (url){ btn.href=url; btn.target='_blank'; btn.rel='noopener noreferrer'; }
    btn.innerHTML = `${socialIcon(k)}<span>${SOCIAL_LABELS[k]}</span>`;
    socialRow.appendChild(btn);
  });
  if (!hasAny) socialRow.innerHTML = `<span style="color:var(--text-dim);font-size:13px;">شبکه اجتماعی ثبت‌شده‌ای موجود نیست</span>`;

  const linksRow = wrap.querySelector('#linksRow');
  if (linksRow){
    Object.entries(rec.links).forEach(([k,v])=>{
      const url = normalizeUrl(v);
      const chip = document.createElement(url?'a':'span');
      chip.className='link-chip';
      if (url){ chip.href=url; chip.target='_blank'; chip.rel='noopener noreferrer'; }
      chip.textContent = LINK_LABELS[k] + (url?'':(': '+v));
      linksRow.appendChild(chip);
    });
  }

  // avatar upload
  const avatarBtn = wrap.querySelector('#avatarBtn');
  const avatarInput = wrap.querySelector('#avatarInput');
  const avatarShape = wrap.querySelector('#avatarShape');
  avatarBtn.onclick = ()=> avatarInput.click();
  avatarInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev)=>{
      img.onload = ()=>{
        const maxDim = 420;
        let w = img.width, h = img.height;
        if (w>h && w>maxDim){ h = h*maxDim/w; w=maxDim; }
        else if (h>=w && h>maxDim){ w = w*maxDim/h; h=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg',0.75);
        enr.image = dataUrl;
        avatarShape.style.backgroundImage = `url('${dataUrl}')`;
        avatarShape.textContent='';
        avatarBtn.textContent='تغییر عکس';
        saveEnrichments();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // description save
  const descArea = wrap.querySelector('#descArea');
  const saveHint = wrap.querySelector('#saveHint');
  wrap.querySelector('#saveDescBtn').onclick = async ()=>{
    enr.desc = descArea.value;
    const ok = await saveEnrichments();
    saveHint.textContent = ok ? 'ذخیره شد ✓' : 'خطا در ذخیره‌سازی';
    saveHint.className = 'save-hint'+(ok?' ok':'');
    setTimeout(()=>{ saveHint.textContent=''; },2500);
  };

  const deleteBtn = wrap.querySelector('#deleteBtn');
  if (deleteBtn){
    deleteBtn.onclick = async ()=>{
      if (!confirm('این هیأت به‌طور کامل حذف شود؟ این کار قابل بازگشت نیست.')) return;
      state.records = state.records.filter(r=> r.id!==rec.id);
      delete state.enrichments[rec.id];
      buildAggregates();
      await saveManualRecords();
      await saveEnrichments();
      location.hash = '#/dashboard';
      render();
    };
  }

  return wrap;
}

            <label>آپارات</label>

          </div>

            <label>وب‌سایت</label>
            <input type="text" name="website" value="${esc(v('website'))}">

    if (!name || !province){ alert('نام هیأت و استان الزامی است.'); return; }

      name, province,
      type: String(fd.get('type')||'').trim() || 'نامشخص',
      tip: String(fd.get('tip')||'').trim() || 'نامشخص',
      city: String(fd.get('city')||'').trim(),
      address: String(fd.get('address')||'').trim(),
      instagram: String(fd.get('instagram')||'').trim(),
      telegram: String(fd.get('telegram')||'').trim(),
      eita: String(fd.get('eita')||'').trim(),
      youtube: String(fd.get('youtube')||'').trim(),
      aparat: String(fd.get('aparat')||'').trim(),
      website: String(fd.get('website')||'').trim(),
      keyPerson: String(fd.get('keyPerson')||'').trim(),
      weekly: String(fd.get('weekly')||'').trim(),
    };
    const desc = String(fd.get('desc')||'').trim();

    if (editing){
      await updateRecord(editId, patch);
      if (!state.enrichments[editId]) state.enrichments[editId] = {desc:'', image:''};
      state.enrichments[editId].desc = desc;
      await saveEnrichments();
      location.hash = '#/heyat/'+encodeURIComponent(editId);
      render();
    } else {
      const id = 'manual__'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      const rec2 = Object.assign({ id, links:{}, source:'manual' }, patch);
      state.records.push(rec2);
      buildAggregates();
      state.loaded = true;
      if (desc){ state.enrichments[id] = {desc, image:''}; await saveEnrichments(); }
      await saveManualRecords();
      location.hash = '#/heyat/'+encodeURIComponent(id);
      render();
    }
  });

  return wrap;
}


/* ======================= Backup / Restore (JSON) ======================= */
function exportBackup(){
  const backup = {
    manual: state.records.filter(r=>r.source==='manual'),
    edits: state.edits,
    enrichments: state.enrichments,
    exportedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'پشتیبان-هیأت‌ها.json'; a.click();
  URL.revokeObjectURL(url);
}
async function importBackupFile(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if (Array.isArray(data.manual)){
      data.manual.forEach(r=>{
        const idx = state.records.findIndex(x=>x.id===r.id);
        if (idx>=0) state.records[idx]=r; else state.records.push(r);
      });
    }
    if (data.edits) state.edits = Object.assign({}, state.edits, data.edits);
    if (data.enrichments) state.enrichments = Object.assign({}, state.enrichments, data.enrichments);
    // اعمال ویرایش‌های تازه‌بازیابی‌شده روی رکوردهای اکسلی موجود
    applyStoredEdits(state.records.filter(r=>r.source==='excel'));
    buildAggregates();
    state.loaded = state.records.length>0;
    await saveManualRecords();
    await saveEdits();
    await saveEnrichments();
    alert('بازیابی از پشتیبان با موفقیت انجام شد.');
    location.hash = '#/dashboard';
    render();
  }catch(e){
    console.error(e);
    alert('فایل پشتیبان معتبر نیست.');
  }
}

/* ======================= Export to Excel ======================= */
function exportToExcel(){
  const wb = XLSX.utils.book_new();
  const byProvince = new Map();
  state.records.forEach(r=>{
    if (!byProvince.has(r.province)) byProvince.set(r.province, []);
    byProvince.get(r.province).push(r);
  });
  const headers = ['نوع','تیپ','نام','استان','شهر','آدرس','اینستا','تلگرام','ایتا / بله','یوتیوب','آپارات','سایت','فرد شاخص','هفتگی','توضیحات'];
  byProvince.forEach((records, province)=>{
    const rows = [headers];
    records.forEach(r=>{
      const enr = state.enrichments[r.id] || {};
      rows.push([r.type, r.tip||'', r.name, r.province, r.city, r.address, r.instagram, r.telegram, r.eita, r.youtube, r.aparat, r.website, r.keyPerson, r.weekly, enr.desc||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    let sheetName = province.substring(0,31);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  XLSX.writeFile(wb, 'خروجی-هیأت‌ها.xlsx');
}

/* ======================= Boot ======================= */
async function boot(){
  await loadEnrichments();
  await loadEdits();
  const manual = await loadManualRecords();
  if (manual && manual.length){
    state.records = manual;
    buildAggregates();
    state.loaded = true;
  }
  render();
}
boot();

})();
</script>
